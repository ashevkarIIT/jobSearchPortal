<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - Simplify</title>
    <script src="jobs.js" defer></script>
    <script src="navbar.js" ></script>
    <link href="output.css" rel="stylesheet"> <!-- Link to your output.css -->

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div id="navbar"></div>
    <main class="flex-grow">

    <!-- Job Details Section -->
    <div class="container mx-auto p-6">
        <div class="bg-white p-6 rounded-lg shadow-lg">        
            <main>
                <div class="mb-4">
                    <label for="search" class="block text-xl text-color1 font-semibold mb-2">Search by Title:</label>
                    <input type="text" id="search" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight" placeholder="e.g., Developer, Manager">
                </div>
                <section>
                    <h2 class="text-2xl font-semibold mb-4 text-color1">Filter Jobs</h2>
                    <form id="jobFilterForm" class="bg-white shadow-md rounded p-4 mb-8">
                        <div class="mb-4">
                            <label for="category" class="block text-color2 text-sm font-bold mb-2">Job Category</label>
                            <select id="category" class="shadow appearance-none border rounded w-full py-2 px-3 text-color3 leading-tight">
                                <option value="">Select a category</option>
                                <option value="IT">IT</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Finance">Finance</option>
                                <option value="Sales">Sales</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Operations">Operations</option>
                                <option value="Design">Design</option>
                                <option value="Business">Business</option>
                            </select>
                        </div>
        
                        <div class="mb-4">
                            <label for="location" class="block text-color2 text-sm font-bold mb-2">Location</label>
                            <select id="location" class="shadow appearance-none border rounded w-full py-2 px-3 text-color3 leading-tight">
                                <option value="">Select a location</option>
                                <option value="New York">New York</option>
                                <option value="San Francisco">San Francisco</option>
                                <option value="Chicago">Chicago</option>
                                <option value="Austin">Austin</option>
                                <option value="Denver">Denver</option>
                                <option value="Miami">Miami</option>
                                <option value="Seattle">Seattle</option>
                                <option value="Los Angeles">Los Angeles</option>
                            </select>
                        </div>
        
                        <div class="text-right">
                            <button type="button" id="button" class="bg-primary text-white py-2 px-4 rounded hover:bg-hover" 
                            
                            >Search Jobs</button>
                        </div>
                    </form>
                </section>
        
                <section>
                    <h2 class="text-2xl font-semibold mb-4 text-color1">Job Listings</h2>
                    <div id="jobList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    </div>
                </section>
            </main>
        </div>
    </div>
</main>
     <!-- Footer -->
  <footer class="bg-primary text-white py-6">
    <div class="container mx-auto text-center">
        <p>&copy; 2024 Simplify. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
